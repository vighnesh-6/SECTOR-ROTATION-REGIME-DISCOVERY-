name: Daily EOD Market Data Ingestion & Regime Pipeline

'on':
  schedule:
    # Primary daily EOD fetch: 7:00 PM IST (13:30 UTC) Monday - Friday
    - cron: '30 13 * * 1-5'
    # Retry 1: 7:30 PM IST (14:00 UTC)
    - cron: '00 14 * * 1-5'
    # Retry 2: 8:00 PM IST (14:30 UTC)
    - cron: '30 14 * * 1-5'
    # Retry 3: 8:30 PM IST (15:00 UTC)
    - cron: '00 15 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target session date for manual catch-up or rerun (YYYY-MM-DD)'
        required: false
        default: ''

concurrency:
  group: daily-eod-pipeline
  cancel-in-progress: false

jobs:
  daily-eod-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn yfinance

      - name: Execute Daily EOD Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python deployment/scripts/run_daily_eod.py --date "${{ github.event.inputs.target_date }}" --trigger "manual_dispatch"
          else
            python deployment/scripts/run_daily_eod.py --trigger "scheduled_cron"
          fi

