name: Independent Event Automation

'on':
  schedule:
    - cron: '30 15 * * 1-5' # Collection: 21:00 IST, Monday-Friday
    - cron: '30 17 * * 1-5' # Read-only freshness check: 23:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry run, isolated persistence verification, production collection, or health'
        type: choice
        options: [dry-run, test-live, live, health]
        default: dry-run
      days:
        description: 'Recent lookback (1-90 days)'
        type: string
        default: '14'
      start_date:
        description: 'Optional recent recovery start (YYYY-MM-DD); RSS coverage is checked'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: independent-event-automation
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install pytest==8.3.4 PyYAML==6.0.3
      - name: Offline event tests and workflow contracts
        run: python -B -m pytest -q -p no:cacheprovider deployment/tests/test_event_ingestion.py deployment/tests/test_event_automation.py deployment/tests/test_event_feed_recovery.py deployment/tests/test_event_archives.py

  events:
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute selected event operation
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
          EVENT_TEST_DATABASE_URL: ${{ secrets.EVENT_TEST_DATABASE_URL || vars.EVENT_TEST_DATABASE_URL || secrets.TEST_DATABASE_URL || vars.TEST_DATABASE_URL || secrets.NEON_TEST_DATABASE_URL || vars.NEON_TEST_DATABASE_URL }}
          EVENT_TEST_BRANCH_CONFIRMED: ${{ vars.EVENT_TEST_BRANCH_CONFIRMED || secrets.EVENT_TEST_BRANCH_CONFIRMED || vars.TEST_BRANCH_CONFIRMED || secrets.TEST_BRANCH_CONFIRMED }}
          EVENT_AUTOMATION_ENABLED: ${{ vars.EVENT_AUTOMATION_ENABLED }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_DAYS: ${{ inputs.days }}
          REQUESTED_START: ${{ inputs.start_date }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          mode="${REQUESTED_MODE:-live}"
          if [[ "$EVENT_SCHEDULE" == '30 17 * * 1-5' ]]; then mode=health; fi
          if [[ "$mode" == test-live ]]; then
            python -m pip install pytest==8.3.4
            echo "### Event Automation: Test-Live Persistence Verification" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "Target branch: \`br-green-lab-a1ywzpjw\` (endpoint: \`ep-lively-voice-a13sw0d6\`)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "- Confirmation flag received: \`${EVENT_TEST_BRANCH_CONFIRMED:-[EMPTY]}\`" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "- Test database URL configured: $(if [[ -n "${EVENT_TEST_DATABASE_URL:-}" ]]; then echo "YES"; else echo "NO"; fi)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            if python -B -m pytest -v -p no:cacheprovider deployment/tests/test_event_neon_persistence.py 2>&1 | tee test_live_output.log; then
              echo "✅ Test-live isolated persistence verification succeeded." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo '```' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              cat test_live_output.log >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo '```' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
            else
              echo "❌ Test-live isolated persistence verification failed." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo '```' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              cat test_live_output.log >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo '```' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 1
            fi
          fi
          if [[ -z "$DATABASE_URL" ]]; then
            echo '::error::Production database secret is missing.'
            exit 1
          fi
          if [[ "$mode" == live && "$EVENT_AUTOMATION_ENABLED" != true ]]; then
            echo '::error::Live collection is disabled. Complete isolated persistence verification and explicitly enable EVENT_AUTOMATION_ENABLED.'
            exit 1
          fi
          args=(--days "${REQUESTED_DAYS:-14}")
          if [[ -n "$REQUESTED_START" ]]; then args+=(--start-date "$REQUESTED_START"); fi
          case "$mode" in
            live) args+=(--live) ;;
            health) args=(--check-health) ;;
            dry-run) ;;
            *) echo '::error::Invalid operation mode.'; exit 1 ;;
          esac
          python -B -m deployment.events.daily_collector "${args[@]}"
      - name: Report failure
        if: failure()
        run: echo '::error::Event automation failed or is partial. Review source statuses in the run summary. Do not enable live collection until blockers are resolved.'
